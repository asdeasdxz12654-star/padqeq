# 의존성 보안 업데이트 (P-02 공급망)
#  · npm(pnpm) 패키지와 GitHub Actions를 매주 확인해 업데이트 PR을 만든다
#  · 보안 취약점 PR은 일정과 상관없이 바로 만들어진다 (저장소 설정 › Dependabot security updates)
#  · 새로 배포된 버전은 7일 기다렸다가 제안한다 (공급망 공격 대비, pnpm minimumReleaseAge와 같은 생각)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # @types/node는 실제 실행 환경(Node 24: CI · engines)과 같은 메이저로 둔다. Node를 올릴 때 함께 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next 16.4는 OpenNext(Cloudflare)가 지원하지 않았다 (preview-props.json → 모든 요청 500, 2026-10-16 배포 사고).
      # 고쳐졌다: @opennextjs/cloudflare 1.20.12 (2026-10-15 공개, PR #1356이 preview-props.json을 글롭에 넣음).
      # 푸는 순서: ① OpenNext를 1.20.12 이상으로 올려 배포가 통과하는지 먼저 본다
      #            ② 통과하면 이 두 줄을 지워 Next 16.4를 받는다 (한꺼번에 올리지 말 것 — 실패하면 원인이 갈린다)
      # 둘 다 cooldown 7일에 걸려 있다: 1.20.12는 10/22, next 16.4.1은 10/21부터 제안된다.
      - dependency-name: "next"
        versions: [">=16.4.0"]
      - dependency-name: "eslint-config-next"
        versions: [">=16.4.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    labels: [dependencies]
