name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 앞선 검사는 취소한다 (새 커밋이 앞선 변경을 모두 담고 있다). 취소된 실행은 다시 돌리지 않는다: 예전 코드가 배포된다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 빌드에 필요한 공개 값. 실제 값이 아니어도 빌드 · 테스트는 된다.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # 외부 액션은 커밋 SHA로 고정 (태그 변조 대비)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm 설치
        run: npm install --global pnpm@12.11.2
      - name: 의존성 설치 (lockfile 고정 · 공급망 정책 검사)
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: 단위 · RLS 테스트
        run: pnpm test
      - name: Cloudflare 배포용 빌드
        run: pnpm exec opennextjs-cloudflare build

  # main에 올라온 코드가 검사를 통과하면 Cloudflare Workers에 배포한다.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 저장소 Settings › Environments › production 에 비밀값을 넣는다
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # 브라우저 코드에 빌드 때 박히는 공개 값 (wrangler.jsonc의 vars와 같아야 한다)
      NEXT_PUBLIC_SUPABASE_URL: https://icmzonndhmqdmqlrmhkn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m0R0KuHySG2IaYFopBjfug_SFXnCC2n
      # 카카오톡 공유 (카카오 앱 › 플랫폼 키 › JavaScript 키, 공개 값 · JavaScript SDK 도메인으로 제한). 비어 있으면 카카오톡 공유를 숨긴다
      NEXT_PUBLIC_KAKAO_JS_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm 설치
        run: npm install --global pnpm@12.11.2
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: Cloudflare용 빌드
        run: pnpm exec opennextjs-cloudflare build
      # 배포 전 실행 확인: 빌드한 Worker를 로컬(workerd)로 띄워 화면이 실제로 나오는지 본다.
      # 빌드 · 테스트는 통과해도 Worker가 시작하다 죽는 경우(2026-10-16 Next 16.4 사고)를 여기서 막는다.
      - name: 배포 전 실행 확인
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-dev.log"
          # 대표 주소로 넘기는 규칙(SITE_HOST)을 로컬 주소로 바꿔 둔다.
          # 사진 주소 서명 키는 진짜 키 대신 이번 확인에만 쓰고 버리는 임의 값 (사진이 있는 화면도 그려지게)
          check_secret=$(openssl rand -hex 32)
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 --var SITE_HOST:127.0.0.1 --var "IMAGE_URL_SECRET:$check_secret" > "$log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          # Worker가 뜰 때까지 (최대 3분)
          for _ in $(seq 1 90); do
            curl -s -o /dev/null --max-time 5 http://127.0.0.1:8787/terms && break
            sleep 2
          done
          failed=0
          summary=""
          for path in /terms / /explore /login; do
            code=$(curl -s -o /dev/null --max-time 30 -w '%{http_code}' "http://127.0.0.1:8787$path")
            echo "$path $code"
            summary="$summary $path=$code"
            [ "$code" = 200 ] || failed=1
          done
          if [ "$failed" = 1 ]; then
            tail -n 80 "$log"
            # 로그를 내려받지 않고도 원인을 볼 수 있게 실패 알림(annotation)에 마지막 로그를 붙인다 (비밀값은 이 단계에 없다)
            detail=$(tail -n 40 "$log" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=배포 전 실행 확인 실패::$summary%0A$detail"
            echo "Worker가 화면을 내지 못해 배포를 멈춥니다"
            exit 1
          fi
      # 되돌릴 곳: 지금 실제 사이트에서 돌고 있는 Worker 버전
      - name: 지금 버전 기록
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -uo pipefail
          version=$(pnpm exec wrangler deployments status --json 2>/dev/null | jq -r '[.versions[]? | select(.percentage == 100) | .version_id][0] // empty' || true)
          echo "지금 버전: ${version:-(알 수 없음)}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: 배포 (비밀값은 같은 버전에 함께 올림)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_URL_SECRET: ${{ secrets.IMAGE_URL_SECRET }}
          # 웹 푸시 (없으면 푸시만 꺼진다)
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test "${#IMAGE_URL_SECRET}" -ge 32 || { echo "IMAGE_URL_SECRET이 없거나 짧습니다"; exit 1; }
          secrets_file="$RUNNER_TEMP/worker-secrets.env"
          umask 077
          printf 'IMAGE_URL_SECRET=%s\n' "$IMAGE_URL_SECRET" > "$secrets_file"
          if [ -n "${VAPID_PRIVATE_KEY:-}" ] && [ -n "${PUSH_DISPATCH_TOKEN:-}" ]; then
            printf 'VAPID_PRIVATE_KEY=%s\nPUSH_DISPATCH_TOKEN=%s\n' "$VAPID_PRIVATE_KEY" "$PUSH_DISPATCH_TOKEN" >> "$secrets_file"
          else
            echo "웹 푸시 비밀값이 없어 푸시는 꺼진 채로 배포합니다"
          fi
          trap 'rm -f "$secrets_file"' EXIT
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
      # 배포 후 확인: 실제 주소에서 화면이 나오는지 본다. 안 나오면 직전 버전으로 바로 되돌리고 실패로 알린다.
      # (DB 마이그레이션은 되돌리지 않는다. Worker 코드 · 비밀값만 직전 버전으로)
      - name: 배포 후 확인 · 자동 되돌리기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          set -uo pipefail
          site="https://www.memories.haedam.app"
          check() {
            local bad=0 code path
            for path in /terms / /explore /login; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$site$path?deploy-check=$GITHUB_RUN_ID")
              echo "  $path $code"
              [ "$code" = 200 ] || bad=1
            done
            return $bad
          }
          # 새 버전이 퍼지는 시간을 두고 몇 번 더 본다
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            echo "확인 $attempt"
            if check; then
              echo "실제 사이트 정상"
              exit 0
            fi
          done
          echo "::error::배포 뒤 실제 사이트가 화면을 내지 못합니다"
          if [ -z "${PREVIOUS_VERSION:-}" ]; then
            echo "::error::되돌릴 버전을 몰라 자동으로 되돌리지 못했습니다. Cloudflare 대시보드 › Workers › haedam › Deployments에서 직전 버전으로 되돌려 주세요"
            exit 1
          fi
          pnpm exec wrangler rollback "$PREVIOUS_VERSION" --message "자동 되돌리기: 배포 후 확인 실패 (run $GITHUB_RUN_ID)" --yes
          sleep 15
          if check; then
            echo "::error::직전 버전($PREVIOUS_VERSION)으로 되돌렸고 사이트는 정상입니다. 이 커밋을 고쳐서 다시 올려 주세요"
          else
            echo "::error::직전 버전으로 되돌렸지만 사이트가 여전히 비정상입니다. Cloudflare 상태와 Supabase를 확인해 주세요"
          fi
          exit 1
