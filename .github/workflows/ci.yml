name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 빌드에 필요한 공개 값. 실제 값이 아니어도 빌드 · 테스트는 된다.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # 외부 액션은 커밋 SHA로 고정 (태그 변조 대비)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm 설치
        run: npm install --global pnpm@12.11.2
      - name: 의존성 설치 (lockfile 고정 · 공급망 정책 검사)
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: 단위 · RLS 테스트
        run: pnpm test
      - name: Cloudflare 배포용 빌드
        run: pnpm exec opennextjs-cloudflare build
