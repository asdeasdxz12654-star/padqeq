name: DB 백업

# 매일 02:00 KST(17:00 UTC). 03:00 KST에 Worker가 백업이 들어왔는지 확인한다.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    # 비밀값을 다 넣은 뒤 저장소 변수 BACKUP_ENABLED=true 로 켠다
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 저장소 Settings › Environments › dhepa 에 비밀값을 넣는다
    environment: dhepa
    steps:
      - name: pg_dump · age 설치
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18 age
          # 러너에 미리 깔린 구버전 pg_dump가 PATH에 먼저 잡히므로 18을 경로로 지정한다.
          # pg_dump는 자기보다 낮은 서버 버전을 덤프할 수 있다 (Supabase 17 → OK)
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: 덤프 → 암호화 → R2 업로드
        env:
          # Supabase › Connect › Session pooler 주소 (GitHub 러너는 IPv6 직접 연결 불가)
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # age 공개키. 개인키는 운영자가 오프라인으로 보관 (복구할 때만 사용)
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          # haedam-backups 버킷에만 쓰기 권한이 있는 R2 API 토큰
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          # R2는 최신 AWS CLI가 기본으로 붙이는 체크섬 헤더를 일부 지원하지 않는다
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          file="haedam-${stamp}.dump.age"

          # 평문 덤프는 디스크에 남기지 않는다
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges \
            --schema=public --schema=private --schema=auth \
            "$SUPABASE_DB_URL" \
            | age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" > "$file"

          # 빈 파일 업로드 방지
          test "$(stat -c %s "$file")" -gt 1024

          aws s3 cp "$file" "s3://haedam-backups/db/${day}/${file}" --endpoint-url "$R2_ENDPOINT"
          rm -f "$file"
          echo "백업 완료: db/${day}/${file}"

      # 백업이 성공한 뒤에만: 탈퇴 유예(30일)가 끝난 계정 영구 삭제 (S-14 ⑤)
      # 운영자 계정 · 촬영 동의 기록이 남은 계정은 건너뛰고 결과에 표시한다 (수동 검토)
      - name: 탈퇴 유예가 끝난 계정 삭제
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -q -A -F ' ' \
            -c "select outcome, count(*) from private.purge_deleted_accounts() group by outcome;"

      # 지워진 사진의 R2 파일 정리. 사진 행이 지워지고 7일이 지난 것만 (최근 백업으로 되살릴 여유)
      # R2 토큰에 haedam-photos 버킷의 Object Read & Write 권한이 있어야 한다
      - name: 지워진 사진 파일 · 오래된 알림 정리
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          psql() { /usr/lib/postgresql/18/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -q -t -A "$@"; }

          echo "오래된 초안 삭제: $(psql -c 'select private.purge_stale_drafts();')건"
          echo "오래된 알림 삭제: $(psql -c 'select private.purge_old_notifications();')건"
          echo "기간이 지난 이용 정지 정리: $(psql -c 'select private.purge_expired_restrictions();')건"
          echo "올리다 그만둔 신고 증거 삭제: $(psql -c 'select private.purge_stale_evidence();')건"
          echo "처리 90일 지난 증거 · 증빙 삭제: $(psql -c 'select private.purge_old_evidence();')건"
          # 알림 보내기(행사 · 이맘때 · 타임캡슐 · 연말 결산)는 '알림 보내기' 워크플로가 아침에 맡는다.
          # 여기서 만들면 새벽 2시에 웹 푸시가 나간다.
          echo "아무도 없는 대화 삭제: $(psql -c 'select private.purge_orphan_threads();')건"
          echo "휴지통 30일 지난 게시물 영구 삭제: $(psql -c 'select private.purge_trashed_posts();')건"
          echo "3일 넘게 쓰지 않은 업로드 자리 삭제: $(psql -c 'select private.purge_stale_upload_slots();')건"

          # 한 번에 최대 200장(파일 1000개 = delete-objects 한도)씩, 최대 10번
          total=0
          for _ in $(seq 1 10); do
            psql -c "select private.storage_trash_due(interval '7 days', 200);" > due.txt
            [ -s due.txt ] || break
            # DB가 돌려준 값이 정해진 형식이 아니면 아무것도 지우지 않고 멈춘다
            if grep -qvxE '[pe]/[0-9a-f]{32}' due.txt; then echo "예상하지 못한 저장 키"; exit 1; fi

            # 사진 p/{토큰} → 변환본 5개, 신고 증거 e/{토큰} → 파일 1개
            jq -R -s '{Quiet: true, Objects: [split("\n")[] | select(length > 0)
              | if startswith("e/") then {Key: "evidence/\(ltrimstr("e/"))"}
                else ltrimstr("p/") as $t
                  | ("4000.avif", "2560.avif", "1200.avif", "400.avif", "1600.jpg") | {Key: "display/\($t)/\(.)"}
                end]}' \
              due.txt > batch.json
            aws s3api delete-objects --bucket haedam-photos --delete file://batch.json \
              --endpoint-url "$R2_ENDPOINT" --output json > result.json
            if [ "$(jq '.Errors // [] | length' result.json)" -ne 0 ]; then jq '.Errors' result.json; exit 1; fi

            keys=$(paste -sd, due.txt)
            # -c는 psql 변수를 치환하지 않으므로 표준 입력으로 넘긴다
            echo "select private.storage_trash_done(string_to_array(:'keys', ','));" | psql -v keys="$keys" > /dev/null
            total=$((total + $(wc -l < due.txt)))
          done
          rm -f due.txt batch.json result.json
          echo "사진 파일 정리: ${total}장"

      # 개인정보처리방침의 보관 기간: 신고 · 운영 조치 기록 3년, 데이터베이스 백업 30일
      - name: 보관 기간이 지난 기록 · 백업 정리
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -q -t -A -F ' ' -c "
            with audit as (delete from private.audit_log where created_at < now() - interval '3 years' returning 1),
                 reports as (delete from public.reports where status <> 'open' and resolved_at < now() - interval '3 years' returning 1),
                 appeals as (delete from public.appeals where status <> 'open' and resolved_at < now() - interval '3 years' returning 1),
                 claims as (delete from public.credit_claims where status <> 'open' and resolved_at < now() - interval '3 years' returning 1),
                 inquiries as (delete from public.inquiries where status = 'answered' and answered_at < now() - interval '3 years' returning 1),
                 comment_reports as (delete from public.comment_reports where status <> 'open' and resolved_at < now() - interval '3 years' returning 1),
                 board_reports as (delete from public.board_reports where status <> 'open' and resolved_at < now() - interval '3 years' returning 1),
                 message_reports as (delete from public.message_reports where status <> 'open' and resolved_at < now() - interval '3 years' returning 1),
                 warnings as (delete from public.member_warnings where created_at < now() - interval '3 years' returning 1)
            select '3년 지난 기록 삭제: 감사', (select count(*) from audit), '신고', (select count(*) from reports),
                   '소명', (select count(*) from appeals), '연결 요청', (select count(*) from claims),
                   '문의', (select count(*) from inquiries), '댓글 신고', (select count(*) from comment_reports),
                   '게시판 신고', (select count(*) from board_reports), '메시지 신고', (select count(*) from message_reports),
                   '경고', (select count(*) from warnings);"

          # 백업은 db/YYYY-MM-DD/ 아래에 있다. 30일보다 오래된 날짜 폴더를 지운다 (오늘 백업은 위에서 이미 올라감)
          cutoff=$(date -u -d '30 days ago' +%F)
          removed=0
          for day in $(aws s3 ls "s3://haedam-backups/db/" --endpoint-url "$R2_ENDPOINT" | awk '$1 == "PRE" { print $2 }' | tr -d '/'); do
            [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || continue
            if [[ "$day" < "$cutoff" ]]; then
              aws s3 rm "s3://haedam-backups/db/${day}/" --recursive --endpoint-url "$R2_ENDPOINT" > /dev/null
              removed=$((removed + 1))
            fi
          done
          echo "30일 지난 백업 삭제: ${removed}일 치"
