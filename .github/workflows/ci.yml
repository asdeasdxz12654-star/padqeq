name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 앞선 검사는 취소한다 (새 커밋이 앞선 변경을 모두 담고 있다). 취소된 실행은 다시 돌리지 않는다: 예전 코드가 배포된다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 빌드에 필요한 공개 값. 실제 값이 아니어도 빌드 · 테스트는 된다.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # 외부 액션은 커밋 SHA로 고정 (태그 변조 대비)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm 설치
        run: npm install --global pnpm@12.11.2
      - name: 의존성 설치 (lockfile 고정 · 공급망 정책 검사)
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: 단위 · RLS 테스트
        run: pnpm test
      - name: Cloudflare 배포용 빌드
        run: pnpm exec opennextjs-cloudflare build

  # main에 올라온 코드가 검사를 통과하면 Cloudflare Workers에 배포한다.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 저장소 Settings › Environments › production 에 비밀값을 넣는다
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # 브라우저 코드에 빌드 때 박히는 공개 값 (wrangler.jsonc의 vars와 같아야 한다)
      NEXT_PUBLIC_SUPABASE_URL: https://icmzonndhmqdmqlrmhkn.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_m0R0KuHySG2IaYFopBjfug_SFXnCC2n
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm 설치
        run: npm install --global pnpm@12.11.2
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: Cloudflare용 빌드
        run: pnpm exec opennextjs-cloudflare build
      - name: 배포 (비밀값은 같은 버전에 함께 올림)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_URL_SECRET: ${{ secrets.IMAGE_URL_SECRET }}
          # 웹 푸시 (없으면 푸시만 꺼진다)
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test "${#IMAGE_URL_SECRET}" -ge 32 || { echo "IMAGE_URL_SECRET이 없거나 짧습니다"; exit 1; }
          secrets_file="$RUNNER_TEMP/worker-secrets.env"
          umask 077
          printf 'IMAGE_URL_SECRET=%s\n' "$IMAGE_URL_SECRET" > "$secrets_file"
          if [ -n "${VAPID_PRIVATE_KEY:-}" ] && [ -n "${PUSH_DISPATCH_TOKEN:-}" ]; then
            printf 'VAPID_PRIVATE_KEY=%s\nPUSH_DISPATCH_TOKEN=%s\n' "$VAPID_PRIVATE_KEY" "$PUSH_DISPATCH_TOKEN" >> "$secrets_file"
          else
            echo "웹 푸시 비밀값이 없어 푸시는 꺼진 채로 배포합니다"
          fi
          trap 'rm -f "$secrets_file"' EXIT
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
